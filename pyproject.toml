[project]
name = "django-business-metrics"
requires-python = ">=3.12"
description = "Django Prometheus business metrics"
keywords = []
license = {text = "MIT"}
readme = "README.md"
authors = [
    {name = "Reef Technologies", email = "opensource@reef.pl"},
    {name = "Vykintas Baltrusaitis", email = "vykintas.baltrusaitis@reef.pl"},
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = [
    "version",
]
dependencies = [
    "Django>=5.2",
    "prometheus-client>=0.13.0",
]

[project.urls]
"Source" = "https://github.com/reef-technologies/django-business-metrics"
"Issue Tracker" = "https://github.com/reef-technologies/django-business-metrics/issues"
"Changelog" = "https://github.com/reef-technologies/django-business-metrics/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.29.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/django_business_metrics/_version.py"

[dependency-groups]
test = [
    "freezegun==1.5.5",
    "pytest==9.0.2",
    "pytest-apiver==0.1.0",
    "pytest-asyncio==1.3.0",
    "pytest-django==4.12.0",
    "pytest-xdist==3.8.0",
]
lint = [
    "codespell[toml]==2.4.2",
    "django-stubs==5.2.9",
    "mypy==1.20.0",
    "ruff==0.15.8",
    "types-freezegun==1.1.10",
    "types-python-dateutil==2.9.0.20260323",
    "types-requests==2.33.0.20260327",
]

[tool.commitizen]
version_provider = "scm"
annotated_tag = true
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true

[tool.pytest.ini_options]
pythonpath = ["."]  # allow for `import tests` in test files
target_package_name = "django_business_metrics"  # required by pytest-apiver

DJANGO_SETTINGS_MODULE="tests.settings"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "D",
    "E", "F", "I", "UP",
    "TC005",
]
ignore = [
    "D100", "D105", "D107", "D200", "D202", "D203", "D205", "D212", "D400", "D401", "D415",
    "D101", "D102", "D103", "D104", # TODO remove once we have docstring for all public methods
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test/**" = ["D", "F403", "F405"]

[tool.codespell]
skip = "*.min.js,uv.lock"
ignore-words-list = "datas"

[tool.bandit]
include = ["django_business_metrics"]
exclude_dirs = ["tests"]

[tool.mypy]

[[tool.mypy.overrides]]
module = [
    "nox",
    "pytest",
    "tests.*",
]
ignore_missing_imports = true

[tool.uv]
exclude-newer = "14 days"
exclude-newer-package = { certifi = false }  # emSign CA removal, see certifi 2026.10.19
constraint-dependencies = ["certifi>=2026.10.19"]
